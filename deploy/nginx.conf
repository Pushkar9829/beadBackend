# EC2 nginx in front of the Node API.
# The package default client_max_body_size is 1m, so any upload over 1 MB is
# rejected with 413 before Express sees it.
#
# On Amazon Linux / Ubuntu this directory is included from the http { } block:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/kuberstones-uploads.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# App caps: images 50 MB, videos 200 MB. 220m leaves room for the multipart wrapper.

client_max_body_size 220m;
proxy_request_buffering off;
proxy_read_timeout 900s;
proxy_send_timeout 900s;
